services:
  - type: web
    name: socialize
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: ADMIN_PASSWORD
        value: change-this-password
      - key: SECRET_KEY
        generateValue: true
